schema_version = 2
id = "openmp-gpu-offloading"
title = "OpenMP GPU offloading"
content_language = "en"
summary = """
Leveraging the compute power of GPU accelerators for scientific computing is becoming increasingly important. There are many programming models for GPU programming, but OpenMP is a vendor-agnostic approach that allows you to write code that can run on a wide variety of GPU hardware. In this training, we will cover GPU programming with OpenMP, and how to optimize performance.
"""
languages = ["C", "C++", "Fortran"]

[[learning_outcomes]]
statement = "Have a good understanding of the GPU hardware and programming model."
competencies = ["gpu-computing.architecture-and-programming-model"]

[[learning_outcomes]]
statement = "Be able to write OpenMP code that offloads to the GPU."
competencies = ["openmp.target-offloading"]

[[learning_outcomes]]
statement = "Understand how to optimize performance of OpenMP GPU code."
competencies = ["openmp.optimize-gpu-offloading"]

[[learning_outcomes]]
statement = "Be able to apply this knowledge to your own scientific computing applications."

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/OpenMP-GPU-offloading/"
website_url = "https://gjbex.github.io/OpenMP-GPU-offloading/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 240
duration_kind = "fixed"
session_count = 1
target_session_duration_minutes = 240
schedule_complete = true
description = """
Total duration: 4 hours.
"""

[audience]
description = """
This training is for you if you want to do GPU programming in C, C++, or Fortran and want a vendor-agnostic approach.
"""

[prerequisites]
summary = """
You will need experience programming in C, C++, or Fortran and be familiar with the OpenMP programming model. If you plan to do GPU programming in a Linux or HPC environment you should be familiar with these as well. More concretely, participants should already be comfortable with the following: * writing and reading small to medium programs in C, C++, or Fortran; * arrays, loops, functions or procedures, and separate compilation at a basic level; * compiling and running programs from the command line; * basic OpenMP shared-memory concepts such as parallel loops, reductions, and the fact that race conditions can occur when threads update shared data; * working from the shell: navigating directories, editing files, and running commands; * basic HPC concepts such as login nodes, compute nodes, and batch jobs if the examples are run on a cluster. Familiarity with C-style raw pointers helps a lot for the C and C++ examples. You do not need prior experience with GPU programming, OpenMP target offloading, device memory management, `target data` regions, or GPU-specific performance tuning. Those are part of the training itself.
"""
competencies = ["command-line.run-or-compile-programs", "openmp.parallel-loops-and-reductions", "openmp.shared-data-and-races", "hpc.distinguish-login-and-compute-nodes"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic language, OpenMP, or shell syntax, you are likely ready for this training.
"""
tasks = [
  "Compile and run a small C, C++, or Fortran program from the command line.",
  "Read a short loop nest over arrays and explain what it computes.",
  "Understand what an OpenMP parallel loop or reduction does at a high level.",
  "Understand at a high level why updating a shared variable from many threads can cause incorrect results.",
  "Read a short program that allocates arrays and passes them to a function.",
  "Make a small change to an existing source file and rebuild it.",
  "Understand at a high level that data on a GPU may need to be transferred to and from host memory."
]

[requirements]
software = [
  "A laptop or desktop with internet access.",
  "A terminal environment that can connect to the system where the examples will run.",
  "An account on an HPC system if the GPU hardware is provided by a cluster.",
  "Compute credits or project allocation if that is required by the HPC system.",
  "A C compiler for the C examples, and a Fortran compiler for the Fortran examples.",
  "CMake for configuring and building the examples.",
  "An OpenMP offloading-capable compiler stack, such as the NVIDIA HPC SDK for NVIDIA GPU examples.",
  "Enough familiarity with the local module or environment system to load the compiler, GPU runtime, and build tools."
]

[level]
introductory_percent = 15
intermediate_percent = 35
advanced_percent = 50
description = """
For participants who already have programming experience in C, C++, or Fortran, and basic OpenMP experience, the material in this training is approximately These percentages describe the level of the GPU-offloading and OpenMP topics covered in the training, not the required entry level in the base programming language itself.
"""

